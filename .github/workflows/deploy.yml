name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repo. Deploys use the Cloudflare token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Cloudflare Web Analytics site token (public). Set as a repository variable CF_BEACON_TOKEN; empty = off.
      NEXT_PUBLIC_CF_BEACON: ${{ vars.CF_BEACON_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5e155e8ca07040e398790f0ecc9c0e43
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set yet - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
        if: steps.token.outputs.ok == 'true'
      - name: Apply database migrations
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply stay-prices --remote
      - name: Build and deploy
        if: steps.token.outputs.ok == 'true'
        run: npm run deploy

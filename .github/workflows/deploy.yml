name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Optional, public-by-design Maps Embed key (restricted to the site). Empty = link-only card.
      NEXT_PUBLIC_MAPS_EMBED_KEY: ${{ secrets.MAPS_EMBED_KEY }}
      CLOUDFLARE_ACCOUNT_ID: 5e155e8ca07040e398790f0ecc9c0e43
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set yet - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - name: Apply database migrations
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply stay-prices --remote
      - name: Build and deploy
        if: steps.token.outputs.ok == 'true'
        run: npm run deploy
